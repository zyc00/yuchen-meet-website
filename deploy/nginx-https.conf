server {
    listen 80;
    server_name meet-api.yuchenzh.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yuchen-meeting-acme;
    }
    location / { return 301 https://meet-api.yuchenzh.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name meet-api.yuchenzh.com;
    ssl_certificate /etc/letsencrypt/live/meet-api.yuchenzh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet-api.yuchenzh.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    client_body_timeout 15s;
    # OAuth authorization codes and booking capabilities must not enter access logs.
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8318;
        proxy_http_version 1.1;
        proxy_set_header Host meet-api.yuchenzh.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
}
